<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CelestKart Space Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --obsidian: #050B17;
    --navy: #0E1A31;
    --platinum: #E8EDF2;
    --gray: #6B7280;
    --ice: #F8FAFC;
    --aurora: #5D9BFF;
    --violet: #9D7DFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background: var(--obsidian);
    color: var(--platinum);
  }
  header {
    position: sticky; top: 0; z-index: 2;
    background: var(--obsidian);
    border-bottom: 1px solid var(--navy);
    padding: 18px 16px 12px;
  }
  .wordmark {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    letter-spacing: .32em;
    font-size: 15px;
    color: var(--platinum);
  }
  .wordmark span { color: var(--aurora); }
  .tagline { color: var(--gray); font-size: 12px; margin-top: 2px; }
  .bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px; gap: 8px;
  }
  .updated { color: var(--gray); font-size: 12px; }
  button.refresh {
    background: var(--aurora); color: var(--obsidian);
    border: 0; border-radius: 8px; padding: 7px 14px;
    font: 600 13px Inter, sans-serif; cursor: pointer;
  }
  button.refresh:disabled { opacity: .5; }
  .filters { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; }
  .chip {
    background: transparent; color: var(--gray);
    border: 1px solid var(--navy); border-radius: 999px;
    padding: 5px 12px; font: 500 12px Inter, sans-serif; cursor: pointer; white-space: nowrap;
  }
  .chip.active { color: var(--obsidian); background: var(--aurora); border-color: var(--aurora); }
  main { padding: 16px; }
  .hero {
    font-family: "Space Grotesk", sans-serif;
    font-size: 20px; font-weight: 600; margin: 4px 0 14px; line-height: 1.25;
  }
  .hero em {
    font-style: normal;
    background: linear-gradient(90deg, var(--aurora), var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .item {
    background: var(--navy);
    border: 1px solid #16233f;
    border-left: 3px solid var(--gray);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .item.supply { border-left-color: var(--aurora); }
  .item.policy { border-left-color: var(--violet); }
  .item.launch { border-left-color: var(--platinum); }
  .tag {
    display: inline-block;
    font: 600 10px Inter, sans-serif;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--aurora);
    border: 1px solid rgba(93,155,255,.35);
    border-radius: 4px; padding: 2px 6px; margin-bottom: 8px;
  }
  .item a {
    color: var(--ice); text-decoration: none;
    font: 600 16px/1.35 "Space Grotesk", sans-serif;
  }
  .item a:hover { color: var(--aurora); }
  .sum { color: #A9B3C7; font-size: 14px; margin-top: 6px; line-height: 1.45; }
  .src { color: var(--gray); font-size: 12px; margin-top: 8px; }
  .status { color: var(--gray); text-align: center; padding: 28px 0; font-size: 14px; }
  .err { color: #FF8A8A; font-size: 12px; padding: 6px 0; }
  footer {
    color: var(--gray); font-size: 11px; text-align: center;
    padding: 16px; border-top: 1px solid var(--navy);
  }
</style>
</head>
<body>
<header>
  <div class="wordmark">CELEST<span>K</span>ART</div>
  <div class="tagline">Building the Supply Chain to Orbit</div>
  <div class="bar">
    <span class="updated" id="updated">Loading…</span>
    <button class="refresh" id="refresh">Refresh</button>
  </div>
  <div class="filters" id="filters">
    <button class="chip active" data-f="all">All</button>
    <button class="chip" data-f="supply">Supply chain</button>
    <button class="chip" data-f="policy">Policy &amp; compliance</button>
    <button class="chip" data-f="launch">Launch</button>
  </div>
</header>
<main>
  <div class="hero">Procurement intel for <em>mission builders</em>.</div>
  <div id="errors"></div>
  <div id="feed"><div class="status">Fetching latest space news…</div></div>
</main>
<footer>CelestKart Space Intel · Stories are summarized from public sources. Verify before acting.</footer>
<script>
// Public RSS feeds, converted to JSON by rss2json. Add or remove feeds here.
const FEEDS = [
  { name: "NASA",            url: "https://www.nasa.gov/feed/" },
  { name: "Spaceflight Now", url: "https://spaceflightnow.com/feed/" },
  { name: "Space.com",       url: "https://www.space.com/feeds/all" }
];
const API = "https://api.rss2json.com/v1/api.json?rss_url=";
const MAX_PER_SOURCE = 8;
const CACHE_KEY = "ckSpaceFeedCache";
const CACHE_MINUTES = 30;

// Procurement relevance rules: a story gets a tag when its text matches.
const RULES = [
  { key: "supply",  label: "Supply chain",       re: /manufactur|supplier|supply chain|component|procure|factory|production|semiconductor|propulsion|parts?\b|contract/i },
  { key: "policy",  label: "Policy & compliance", re: /policy|regulat|export|ITAR|sanction|IN-SPACe|ISRO|NSIL|FDI|licens|law|bill|liability|insurance|government/i },
  { key: "launch",  label: "Launch",              re: /launch|rocket|liftoff|falcon|starship|orbit|payload|satellite/i }
];

const feedEl = document.getElementById("feed");
const errEl = document.getElementById("errors");
const updatedEl = document.getElementById("updated");
const btn = document.getElementById("refresh");
let allItems = [];
let filter = "all";

function stripHtml(html) {
  const d = document.createElement("div");
  d.innerHTML = html || "";
  return (d.textContent || "").trim().slice(0, 220);
}

function tagsFor(item) {
  const text = item.title + " " + item.summary;
  return RULES.filter(r => r.re.test(text));
}

async function fetchFeed(feed) {
  const res = await fetch(API + encodeURIComponent(feed.url));
  if (!res.ok) throw new Error(feed.name + ": HTTP " + res.status);
  const data = await res.json();
  if (data.status !== "ok") throw new Error(feed.name + ": feed unavailable");
  return data.items.slice(0, MAX_PER_SOURCE).map(i => ({
    title: i.title,
    link: i.link,
    summary: stripHtml(i.description),
    date: new Date(i.pubDate.replace(" ", "T") + "Z").toISOString(),
    source: feed.name
  }));
}

function readCache() {
  return JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
}

function render() {
  const visible = allItems
    .map(it => ({ ...it, tags: tagsFor(it) }))
    .filter(it => filter === "all" || it.tags.some(t => t.key === filter))
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  feedEl.innerHTML = "";
  if (!visible.length) {
    feedEl.innerHTML = '<div class="status">No stories match this filter right now.</div>';
    return;
  }
  for (const it of visible) {
    const card = document.createElement("div");
    card.className = "item " + (it.tags[0] ? it.tags[0].key : "general");
    const tagText = it.tags.length ? it.tags.map(t => t.label).join(" · ") : "General";
    card.innerHTML =
      '<div class="tag"></div>' +
      '<a target="_blank" rel="noopener"></a>' +
      '<div class="sum"></div>' +
      '<div class="src"></div>';
    card.querySelector(".tag").textContent = tagText;
    card.querySelector("a").href = it.link;
    card.querySelector("a").textContent = it.title;
    card.querySelector(".sum").textContent = it.summary;
    card.querySelector(".src").textContent = it.source + " · " + new Date(it.date).toLocaleString();
    feedEl.appendChild(card);
  }
}

async function load(force) {
  const cached = readCache();
  const fresh = cached && (Date.now() - cached.time) < CACHE_MINUTES * 60000;
  if (!force && fresh) {
    allItems = cached.items;
    render();
    updatedEl.textContent = "Cached " + new Date(cached.time).toLocaleTimeString();
    return;
  }
  btn.disabled = true;
  updatedEl.textContent = "Updating…";
  const results = await Promise.allSettled(FEEDS.map(fetchFeed));
  const items = [], failures = [];
  results.forEach(r => {
    if (r.status === "fulfilled") items.push(...r.value);
    else failures.push(r.reason.message);
  });
  errEl.innerHTML = failures.map(f => '<div class="err">⚠ ' + f + "</div>").join("");

  if (items.length) {
    allItems = items;
    localStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), items }));
    render();
    updatedEl.textContent = "Updated " + new Date().toLocaleTimeString();
  } else if (cached) {
    allItems = cached.items;
    render();
    errEl.innerHTML += '<div class="err">Live fetch failed; showing last saved stories.</div>';
    updatedEl.textContent = "Saved " + new Date(cached.time).toLocaleTimeString();
  } else {
    feedEl.innerHTML = '<div class="status">Could not load feeds. Check your connection and tap Refresh.</div>';
    updatedEl.textContent = "Offline";
  }
  btn.disabled = false;
}

document.getElementById("filters").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  filter = chip.dataset.f;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === chip));
  render();
});
btn.addEventListener("click", () => load(true));
load(false);
</script>
</body>
</html>
